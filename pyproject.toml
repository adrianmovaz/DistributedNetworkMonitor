[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "distributed-network-monitor"
version = "0.1.0"
description = "Socket-based distributed network monitoring course project"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "dnspython>=2.7,<3",
    "pysnmp>=7.1,<8",
    "python-dotenv>=1.0,<2",
]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "ruff>=0.11,<1"]

[project.scripts]
dnm = "network_monitor.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I"]
