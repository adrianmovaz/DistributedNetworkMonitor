name: distributed-network-monitor

# External laboratory services only. Run the Python application on your host.
services:
  snmp:
    build: ./infra/network
    command: ["snmpd", "-f", "-Lo", "-C", "-c", "/etc/snmp/snmpd.conf"]
    ports:
      - "127.0.0.1:1161:161/udp"
  dns:
    build: ./infra/network
    command: ["dnsmasq", "--keep-in-foreground", "--user=root", "--conf-file=/etc/dnsmasq.conf"]
    ports:
      - "127.0.0.1:1053:53/udp"
      - "127.0.0.1:1053:53/tcp"
  ftp:
    build: ./infra/ftp
    ports:
      - "127.0.0.1:2121:2121"
      - "127.0.0.1:30000-30009:30000-30009"
    volumes:
      - ftp-reports:/srv/ftp
  smtp:
    image: axllent/mailpit:v1.31.2
    ports:
      - "127.0.0.1:1025:1025"
      - "127.0.0.1:8025:8025"

volumes:
  ftp-reports:
